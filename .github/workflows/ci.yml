name: EvidPort checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked tooling
        run: python -m pip install uv==0.12.17
      - name: Install locked PDF and development dependencies
        run: uv sync --frozen --extra pdf --extra dev
      - name: Run synthetic tests
        run: uv run --frozen --no-sync pytest
      - name: Lint
        run: uv run --frozen --no-sync ruff check --output-format github .
      - name: Build distributable
        run: uv build
